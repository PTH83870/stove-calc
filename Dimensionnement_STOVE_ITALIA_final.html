    for (var i = 0; i < gVals.length; i++) { if (gVals[i] > maxG) maxG = gVals[i]; }
    var html2 = '';
    for (var i = 0; i < gLabels.length; i++) {
        var v = gVals[i] > 0 ? gVals[i] : 0;
        html2 += makeBar(gLabels[i], v, maxG > 0 ? maxG : 1, gColors[i]);
    }
    document.getElementById('chartEconomiesCSS').innerHTML = html2;
}

function calculer() {
    var c3 = document.getElementById('c3').value;
    var c4 = parseFloat(document.getElementById('c4').value);
    var c5 = parseFloat(document.getElementById('c5').value);
    var c7 = parseFloat(document.getElementById('c6').value);
    var c9 = parseFloat(document.getElementById('c9').value);
    var c10 = document.getElementById('c10').value;
    var c11 = document.getElementById('c11').value;
    var c12 = parseFloat(document.getElementById('c12').value);
    var c15 = parseInt(document.getElementById('c15').value);
    var c21 = document.getElementById('c21').value;
    if (!c3 || !c21) return;
    var climat = dataClimat[c3];
    var tb = climat[0];
    var dju = climat[1];
    var corr = (c4 <= 200) ? 0 : (c4 <= 600) ? (c4 - 200) / 100 : 4 + ((c4 - 600) / 100 * 2);
    var c8 = tb - corr;
    var c14 = (c5 * c7 * (c9 - c8)) * (c11 === "OUI" ? 1.2 : 1.1) * c12;
    var c20 = Math.round((dju * 24) / (c9 - c8));
    var pts = annexes[c15];
    var sel = pts[0];
    for (var i = 0; i < pts.length; i++) { if (c8 >= pts[i].t) sel = pts[i]; else break; }
    var c16 = (c10 === "35" ? sel.p35 : sel.p55) * 1000;
    var ratio = c16 / c14;
    var v = document.getElementById('verdict');
    if (ratio < 0.6) { v.className = "verdict v-sous"; v.textContent = "⚠️ SOUS-DIMENSIONNÉ (Non éligible prime)"; }
    else if (ratio > 1.2) { v.className = "verdict v-sur"; v.textContent = "⚠️ SUR-DIMENSIONNÉ (Risque de courts-cycles)"; }
    else { v.className = "verdict v-ok"; v.textContent = "✅ DIMENSIONNEMENT OPTIMAL (Éligible prime)"; }
    var besoinThermKwh = (c14 * c20) / 1000;
    var scop = dataSCOP[c15][c10];
    var pData = dataPoeles[c21];
    var qPAC = Math.round(besoinThermKwh / scop);
    var qFioul = Math.round(besoinThermKwh / 0.85 / 10);
    var qGaz = Math.round(besoinThermKwh / 0.9 / 11);
    var qRad = Math.round(besoinThermKwh);
    var qGran = Math.round(besoinThermKwh / (4.8 * 15 * (pData[0] / 100) * pData[1]));
    var couts = {
        pac: Math.round(qPAC * TARIFS.ELEC),
        fioul: Math.round(qFioul * TARIFS.FIOUL),
        gaz: Math.round(qGaz * TARIFS.GAZ * 11),
        rad: Math.round(qRad * TARIFS.ELEC),
        gran: Math.round(qGran * TARIFS.GRANULES)
    };
    document.getElementById('resC14').textContent = fNum(c14) + " W";
    document.getElementById('resC8').textContent = fDec(c8, 1) + " °C";
    document.getElementById('resC20').textContent = c20 + " h";
    document.getElementById('resC16').textContent = fNum(c16) + " W";
    var rows = '';
    var fg = function(c) { return (c - couts.pac) > 0 ? '<br><span class="gain">Gain PAC : +' + fNum(c - couts.pac) + ' €/an</span>' : ''; };
    rows += '<thead><tr><th>Énergie</th><th>Conso Annuelle</th><th>Coût Estimé</th></tr></thead><tbody>';
    rows += '<tr class="highlight"><td>PAC</td><td>' + fNum(qPAC) + ' kWh/an</td><td>' + fNum(couts.pac) + ' €</td></tr>';
    rows += '<tr><td><b>FIOUL</b></td><td>' + fNum(qFioul) + ' L/an</td><td>' + fNum(couts.fioul) + ' €' + fg(couts.fioul) + '</td></tr>';
    rows += '<tr><td><b>GAZ</b></td><td>' + fNum(qGaz) + ' m³/an</td><td>' + fNum(couts.gaz) + ' €' + fg(couts.gaz) + '</td></tr>';
    rows += '<tr><td><b>RADIATEURS</b></td><td>' + fNum(qRad) + ' kWh/an</td><td>' + fNum(couts.rad) + ' €' + fg(couts.rad) + '</td></tr>';
    rows += '<tr><td><b>GRANULÉS</b></td><td>' + fNum(qGran) + ' sacs/an</td><td>' + fNum(couts.gran) + ' €' + fg(couts.gran) + '</td></tr>';
    rows += '</tbody>';
    document.getElementById('consoTable').innerHTML = rows;
    updateCharts(couts);
}

window.onload = function() { calculer(); };
</script>
